<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Reservatórios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i data-lucide="waves" class="h-8 w-8 text-brand-600 mr-2"></i>
                    <span class="font-bold text-xl text-gray-900">ReservaTrack MVP</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Tabs -->
        <div class="border-b border-gray-200 mb-8">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-active whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i>
                    Monitoramento (Dashboard)
                </button>
                <button onclick="switchTab('cadastro')" id="tab-cadastro" class="tab-inactive whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center">
                    <i data-lucide="database" class="w-4 h-4 mr-2"></i>
                    Cadastro de Reservatórios
                </button>
            </nav>
        </div>

        <!-- ABA: DASHBOARD -->
        <div id="view-dashboard" class="block">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Controles / Entrada de Dados -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-1">
                    <h2 class="text-lg font-semibold mb-4 flex items-center text-gray-800">
                        <i data-lucide="sliders-horizontal" class="w-5 h-5 mr-2 text-brand-500"></i>
                        Entrada de Dados
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Selecione o Reservatório</label>
                            <select id="select-reservatorio" onchange="loadReservatorioData()" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-500 focus:border-brand-500 p-2 border">
                                <!-- Options populated by JS -->
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nível Atual (Centímetros)</label>
                            <input type="number" id="input-nivel" oninput="calculateMetrics()" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-500 focus:border-brand-500 p-2 border" placeholder="Ex: 250">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Vazão Entrada (m³/h)</label>
                                <input type="number" id="input-vazao-entrada" oninput="calculateMetrics()" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-500 focus:border-brand-500 p-2 border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Vazão Saída (m³/h)</label>
                                <input type="number" id="input-vazao-saida" oninput="calculateMetrics()" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-500 focus:border-brand-500 p-2 border">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Visores e Gráficos -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- Cards de Informação -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Volume Atual -->
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
                                <i data-lucide="droplets" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-500">Volume Atual Estimado</p>
                                <h3 class="text-2xl font-bold text-gray-900" id="display-volume">0 m³</h3>
                                <p class="text-sm text-gray-500 mt-1" id="display-capacidade">Capacidade Máxima: 0 m³</p>
                                <!-- Progress Bar -->
                                <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                                  <div id="bar-volume" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                                <p class="text-xs text-right mt-1 font-semibold text-blue-700" id="display-percentual">0%</p>
                            </div>
                        </div>

                        <!-- Status Tendência -->
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                            <div id="icon-status-bg" class="p-3 rounded-full bg-gray-100 text-gray-600 mr-4">
                                <i data-lucide="activity" id="icon-status" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-500">Projeção (Balanço hídrico)</p>
                                <h3 class="text-xl font-bold text-gray-900" id="display-status">Estável</h3>
                                <p class="text-sm mt-1" id="display-tempo-estimado">-</p>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-semibold mb-4 text-gray-800">Tendência de Volume (Próximas horas)</h2>
                        <div class="relative h-72 w-full">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- ABA: CADASTRO -->
        <div id="view-cadastro" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800">Reservatórios Cadastrados (Mock)</h2>
                    <button class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        + Novo Reservatório
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3">Nome</th>
                                <th scope="col" class="px-6 py-3">Formato</th>
                                <th scope="col" class="px-6 py-3">Dimensões</th>
                                <th scope="col" class="px-6 py-3">Capacidade Máx.</th>
                                <th scope="col" class="px-6 py-3">Vazões Padrão (Entrada/Saída)</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-reservatorios">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Inicializa ícones do Lucide
        lucide.createIcons();

        // Dados Mockados conforme solicitado
        const mockReservatorios = [
            { 
                id: 1, 
                nome: "Tanguá", 
                formato: "retangular", 
                comprimento: 20, 
                largura: 30, 
                altura: 4, 
                vazaoEntrada: 180, 
                vazaoSaida: 280 
            },
            { 
                id: 2, 
                nome: "Monte Santo", 
                formato: "retangular", 
                comprimento: 20, 
                largura: 30, 
                altura: 4, 
                vazaoEntrada: 600, 
                vazaoSaida: 890 
            },
            { 
                id: 3, 
                nome: "RAP2", 
                formato: "cilindrico", 
                diametro: 60, 
                altura: 3.5, 
                vazaoEntrada: 180, 
                vazaoSaida: 250 
            }
        ];

        let chartInstance = null;
        let reservatorioAtual = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            initCadastroTable();
            initSelectOptions();
            
            // Seleciona o primeiro por padrão
            document.getElementById('select-reservatorio').value = mockReservatorios[0].id;
            loadReservatorioData();
            
            // Mock de nível inicial (metade da altura)
            document.getElementById('input-nivel').value = (reservatorioAtual.altura / 2) * 100;
            calculateMetrics();
        });

        // Alternância de Abas
        function switchTab(tab) {
            document.getElementById('view-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('view-cadastro').classList.toggle('hidden', tab !== 'cadastro');
            
            document.getElementById('tab-dashboard').className = tab === 'dashboard' ? 'tab-active whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center' : 'tab-inactive whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center';
            document.getElementById('tab-cadastro').className = tab === 'cadastro' ? 'tab-active whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center' : 'tab-inactive whitespace-nowrap py-4 px-1 text-sm font-medium flex items-center';
        }

        // Popula a tabela de cadastro
        function initCadastroTable() {
            const tbody = document.getElementById('tabela-reservatorios');
            tbody.innerHTML = '';
            
            mockReservatorios.forEach(r => {
                let dimensoes = r.formato === 'retangular' 
                    ? `${r.comprimento}m x ${r.largura}m x ${r.altura}m` 
                    : `Ø ${r.diametro}m x h ${r.altura}m`;
                
                let capacidade = calcularCapacidadeMaxima(r).toFixed(2);

                const tr = document.createElement('tr');
                tr.className = "bg-white border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-900">${r.nome}</td>
                    <td class="px-6 py-4 capitalize">${r.formato}</td>
                    <td class="px-6 py-4">${dimensoes}</td>
                    <td class="px-6 py-4">${capacidade} m³</td>
                    <td class="px-6 py-4">${r.vazaoEntrada} / ${r.vazaoSaida} m³/h</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Popula o select do Dashboard
        function initSelectOptions() {
            const select = document.getElementById('select-reservatorio');
            select.innerHTML = '';
            mockReservatorios.forEach(r => {
                const option = document.createElement('option');
                option.value = r.id;
                option.text = r.nome;
                select.appendChild(option);
            });
        }

        // Carrega dados do reservatório selecionado para os inputs
        function loadReservatorioData() {
            const id = parseInt(document.getElementById('select-reservatorio').value);
            reservatorioAtual = mockReservatorios.find(r => r.id === id);
            
            document.getElementById('input-vazao-entrada').value = reservatorioAtual.vazaoEntrada;
            document.getElementById('input-vazao-saida').value = reservatorioAtual.vazaoSaida;
            
            // Sugere um nível atual aleatório só pra não vir zerado ao trocar
            document.getElementById('input-nivel').value = Math.floor((reservatorioAtual.altura * 100) * 0.7); 
            
            calculateMetrics();
        }

        // --- LÓGICA MATEMÁTICA E REGRAS DE NEGÓCIO ---

        function calcularCapacidadeMaxima(res) {
            if (res.formato === 'retangular') {
                return res.comprimento * res.largura * res.altura;
            } else if (res.formato === 'cilindrico') {
                const raio = res.diametro / 2;
                return Math.PI * Math.pow(raio, 2) * res.altura;
            }
            return 0;
        }

        function calcularVolumeAtual(res, nivelCm) {
            const nivelMetros = nivelCm / 100;
            // Limita o nível máximo à altura do reservatório
            const nivelCalculo = Math.min(nivelMetros, res.altura);

            if (res.formato === 'retangular') {
                return res.comprimento * res.largura * nivelCalculo;
            } else if (res.formato === 'cilindrico') {
                const raio = res.diametro / 2;
                return Math.PI * Math.pow(raio, 2) * nivelCalculo;
            }
            return 0;
        }

        function calculateMetrics() {
            if (!reservatorioAtual) return;

            const nivelCm = parseFloat(document.getElementById('input-nivel').value) || 0;
            const vazaoIn = parseFloat(document.getElementById('input-vazao-entrada').value) || 0;
            const vazaoOut = parseFloat(document.getElementById('input-vazao-saida').value) || 0;

            const capacidadeMax = calcularCapacidadeMaxima(reservatorioAtual);
            const volumeAtual = calcularVolumeAtual(reservatorioAtual, Math.max(0, nivelCm));
            
            const percentual = Math.min(100, Math.max(0, (volumeAtual / capacidadeMax) * 100));

            // Atualiza UI de Volumes
            document.getElementById('display-volume').innerText = volumeAtual.toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' m³';
            document.getElementById('display-capacidade').innerText = 'Capacidade Máxima: ' + capacidadeMax.toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' m³';
            document.getElementById('bar-volume').style.width = percentual + '%';
            document.getElementById('display-percentual').innerText = percentual.toFixed(1) + '%';
            
            // Muda cor da barra dependendo do nível
            const bar = document.getElementById('bar-volume');
            if (percentual > 90) { bar.className = "bg-red-500 h-2.5 rounded-full transition-all duration-500"; }
            else if (percentual < 15) { bar.className = "bg-yellow-500 h-2.5 rounded-full transition-all duration-500"; }
            else { bar.className = "bg-blue-600 h-2.5 rounded-full transition-all duration-500"; }

            // Lógica de Tendência
            const balanco = vazaoIn - vazaoOut; // m³ por hora
            
            const displayStatus = document.getElementById('display-status');
            const displayTempo = document.getElementById('display-tempo-estimado');
            const iconBg = document.getElementById('icon-status-bg');
            const icon = document.getElementById('icon-status');

            if (balanco > 0) {
                const volumeFaltante = capacidadeMax - volumeAtual;
                const horasParaExtravasar = volumeFaltante / balanco;
                
                displayStatus.innerText = "Enchendo (Risco Extravasar)";
                displayStatus.className = "text-xl font-bold text-red-600";
                
                if (horasParaExtravasar <= 0) {
                    displayTempo.innerText = "Reservatório já está cheio ou transbordando.";
                    displayTempo.className = "text-sm mt-1 text-red-600 font-medium";
                } else {
                    displayTempo.innerText = `Estimativa para extravasar: ~${horasParaExtravasar.toFixed(1)} horas.`;
                    displayTempo.className = "text-sm mt-1 text-gray-600";
                }

                iconBg.className = "p-3 rounded-full bg-red-100 text-red-600 mr-4";
                icon.setAttribute("data-lucide", "trending-up");

            } else if (balanco < 0) {
                const horasParaEsvaziar = volumeAtual / Math.abs(balanco);
                
                displayStatus.innerText = "Esvaziando";
                displayStatus.className = "text-xl font-bold text-yellow-600";
                
                if (horasParaEsvaziar <= 0) {
                    displayTempo.innerText = "Reservatório já está vazio.";
                    displayTempo.className = "text-sm mt-1 text-yellow-600 font-medium";
                } else {
                    displayTempo.innerText = `Estimativa para secar: ~${horasParaEsvaziar.toFixed(1)} horas.`;
                    displayTempo.className = "text-sm mt-1 text-gray-600";
                }

                iconBg.className = "p-3 rounded-full bg-yellow-100 text-yellow-600 mr-4";
                icon.setAttribute("data-lucide", "trending-down");

            } else {
                displayStatus.innerText = "Estável";
                displayStatus.className = "text-xl font-bold text-green-600";
                displayTempo.innerText = "Vazão de entrada é igual a de saída.";
                displayTempo.className = "text-sm mt-1 text-gray-600";
                
                iconBg.className = "p-3 rounded-full bg-green-100 text-green-600 mr-4";
                icon.setAttribute("data-lucide", "minus");
            }
            
            lucide.createIcons();
            
            // Atualiza Gráfico
            updateChart(volumeAtual, capacidadeMax, balanco);
        }

        function updateChart(volumeAtual, capacidadeMax, balancoPorHora) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            // Gera projeção para as próximas 24 horas
            const labels = [];
            const data = [];
            let currentVol = volumeAtual;

            for (let hora = 0; hora <= 24; hora++) {
                labels.push(`+${hora}h`);
                data.push(currentVol);

                currentVol += balancoPorHora;
                // Clampa os limites físicos
                if (currentVol > capacidadeMax) currentVol = capacidadeMax;
                if (currentVol < 0) currentVol = 0;
            }

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Volume Projetado (m³)',
                            data: data,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1
                        },
                        {
                            label: 'Capacidade Máxima',
                            data: Array(25).fill(capacidadeMax),
                            borderColor: '#ef4444',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMax: capacidadeMax * 1.1,
                            title: { display: true, text: 'Volume (m³)' }
                        },
                        x: {
                            title: { display: true, text: 'Horizonte de Tempo (Horas)' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + ' m³';
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>

```
